# Render Blueprint for the Flask API (free plan). New > Blueprint > pick this repo.
services:
  - type: web
    name: job-market-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      # Email alerts: the API sends confirmation emails through the HTTPS relay
      # (Render's free plan blocks SMTP ports). See docs/email-relay.gs.
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_TOKEN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
